<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#4dabf7">
<title>Jom Main! Permainan Tadika</title>
<style>
:root{--bg:#fff6d6;--card:#fff;--ink:#2b2d42;--a:#ff6b6b;--b:#4dabf7;--c:#51cf66;--d:#ffa94d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Comic Sans MS","Trebuchet MS",system-ui,sans-serif;overflow:hidden}
body{padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
.screen{display:none;height:100%;flex-direction:column;align-items:center;gap:12px;text-align:center;overflow-y:auto;padding:10px 0}
.screen.on{display:flex}#home,#end{justify-content:center;gap:16px}
h1{font-size:clamp(26px,8vw,42px);margin:0}h2{margin:0}
.lv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:460px}
.chip{border:3px solid #dee2e6;background:#fff;border-radius:16px;padding:8px 2px;font:inherit;font-size:15px;font-weight:700;color:var(--ink)}
.chip.on{border-color:var(--b);background:#d0ebff}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:460px}
.btn{border:0;border-radius:22px;padding:14px 8px;font:inherit;font-size:19px;font-weight:700;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.18)}.btn span{display:block;font-size:38px}
#top{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center;font-size:19px;font-weight:700}
#big{font-size:clamp(50px,20vw,100px);line-height:1.1;word-break:break-word}#big.s{font-size:clamp(30px,10vw,52px)}
#q{font-size:clamp(19px,5.5vw,28px);font-weight:700}
#opts{display:flex;gap:8px;width:100%;max-width:520px;justify-content:center;flex-wrap:wrap}
.opt{flex:1;min-width:84px;background:var(--card);border:4px solid #dee2e6;border-radius:20px;padding:10px 4px;font:inherit;font-size:clamp(26px,8vw,44px);color:var(--ink)}
.opt.lg{font-size:clamp(17px,4.6vw,24px)}.opt.n{flex:0 0 17%;min-width:0;font-size:24px;padding:6px 0}
.opt small{display:block;font-size:16px;opacity:.7}.opt.ok{border-color:var(--c);background:#d3f9d8}.opt.no{border-color:var(--a);background:#ffe3e3}
#dz{display:none;width:100%;max-width:520px}#slots,#tray{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}#tray{margin-top:14px;min-height:64px;padding:8px;background:#fff8;border-radius:16px}
.slot{min-width:70px;min-height:70px;border:3px dashed #adb5bd;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;font-size:26px;background:#fff6}
.slot b{font-size:15px}.slot.ok{border:3px solid var(--c);background:#d3f9d8}
.tok{background:#fff;border:3px solid var(--b);border-radius:16px;padding:8px 12px;font-size:26px;font-weight:700;touch-action:none;cursor:grab}
.tok.sel{outline:4px solid var(--d)}.tok.lift{opacity:.25}.ghost{position:fixed;pointer-events:none;z-index:99;transform:scale(1.15);box-shadow:0 8px 16px #0004}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#bar{width:100%;max-width:520px;height:12px;background:#dee2e6;border-radius:9px;overflow:hidden;flex:none}#bar i{display:block;height:100%;width:0;background:var(--c)}
#msg{font-size:17px;min-height:1.4em}
#camwrap{position:relative;width:120px;height:90px;border-radius:16px;overflow:hidden;border:4px solid var(--b);background:#000;flex:none}
video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#fing{position:absolute;right:6px;bottom:0;font-size:30px;font-weight:700;color:#fff;text-shadow:0 0 6px #000}
.small{font-size:15px;opacity:.75;max-width:420px}.link{background:none;border:0;font:inherit;text-decoration:underline;color:var(--ink);font-size:16px}
table{border-collapse:collapse;width:100%;max-width:520px;background:#fff;border-radius:14px;overflow:hidden;font-size:15px}td,th{padding:7px 5px;border-bottom:1px solid #eee}th{background:#d0ebff}
.row{width:100%;max-width:520px;display:flex;justify-content:space-between;background:#fff;padding:8px 12px;border-radius:12px;font-size:15px}
#splash{justify-content:center;gap:22px}
#ttl{display:flex;justify-content:center;flex-wrap:wrap;margin-top:6px}
#ttl span{display:inline-block;font-size:clamp(40px,13vw,72px);font-weight:900;animation:bn 1.1s ease-in-out infinite;cursor:pointer}
@keyframes bn{0%,100%{transform:translateY(0) scaleY(1)}40%{transform:translateY(-26px) scaleY(1.1)}60%{transform:translateY(0) scaleY(.85)}}
#ttl span.pop{animation:pp .5s}@keyframes pp{50%{transform:scale(1.6) rotate(15deg)}}
#arena{position:relative;width:100%;max-width:520px;height:140px;background:#fff8;border-radius:20px;overflow:hidden;flex:none}
.bl{position:absolute;left:0;top:0;width:54px;height:54px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:30px;font-weight:900;color:#fff;cursor:pointer;touch-action:manipulation}
.balloon{position:fixed;bottom:-70px;font-size:48px;z-index:5;animation:fl linear forwards;cursor:pointer;touch-action:manipulation}
@keyframes fl{to{transform:translateY(-115vh)}}
.conf{position:fixed;pointer-events:none;z-index:99;font-size:22px;animation:cf .9s ease-out forwards}
@keyframes cf{to{transform:translate(var(--x),var(--y)) rotate(360deg);opacity:0}}
#nm{font:inherit;font-size:18px;padding:10px 14px;border:3px solid var(--b);border-radius:16px;width:62%;max-width:260px;text-align:center;user-select:text;-webkit-user-select:text}
.credit{font-size:13px;line-height:1.4;opacity:.7}
</style>
</head>
<body>

<section id="splash" class="screen on">
  <div id="ttl"></div>
  <div id="arena"></div>
  <div><input id="nm" maxlength="12" placeholder="Taip nama kamu ✏️"> <button class="btn" style="background:var(--a);padding:10px 14px;font-size:16px" id="go">Melantun!</button></div>
  <b id="pc" style="display:none"></b>
  <button class="btn" style="background:var(--c);padding:14px 36px;font-size:24px" id="play">▶️ Jom Main!</button>
  <button class="link" id="seeres" style="display:none"></button>
  <div class="credit">Dicipta oleh <b>Amirul Afiq Ariffin</b><br>Daripada ibu bapa, untuk ibu bapa 💛</div>
</section>

<section id="home" class="screen">
  <h1>🌈 Jom Main!</h1><div id="hi" style="font-size:20px;font-weight:700"></div>
  <div>Pilih tahap</div>
  <div class="lv" id="lv"></div>
  <div>Pilih subjek</div>
  <div class="menu">
    <button class="btn" style="background:var(--a)" data-s="bm"><span>🅰️</span>Bahasa Melayu</button>
    <button class="btn" style="background:var(--b)" data-s="mt"><span>🔢</span>Matematik</button>
    <button class="btn" style="background:var(--c)" data-s="en"><span>🎨</span>English</button>
    <button class="btn" style="background:var(--d)" data-s="sn"><span>🐾</span>Sains</button>
  </div>
  <button class="btn" style="background:#845ef7;padding:10px 24px;font-size:17px" id="rep">📒 Kad Laporan / Report</button>
  <button class="link" data-x>🚪 Keluar</button>
</section>

<section id="game" class="screen" style="justify-content:flex-start">
  <div id="top"><span id="sc">⭐ 0</span><span id="rd">1/5</span><span><button class="link" id="back">🏠</button> <button class="link" data-x>🚪</button></span></div>
  <div id="big"></div><div id="q"></div>
  <div id="opts"></div>
  <div id="dz"><div id="slots"></div><div id="tray"></div></div>
  <div id="bar"><i></i></div><div id="msg"></div>
  <div id="camwrap"><video id="v" playsinline muted autoplay></video><canvas id="cv"></canvas><div id="fing">0</div></div>
  <button class="link" id="cambtn">📷 Hidupkan kamera / Turn on camera</button>
</section>

<section id="end" class="screen">
  <h1 id="endt">🎉</h1><div id="stars" style="font-size:32px;max-width:420px"></div><div id="endinfo"></div>
  <button class="btn" style="background:var(--b);padding:14px 30px" id="again">Main lagi!</button>
  <button class="btn" style="background:var(--c);padding:14px 30px;display:none" id="upg">⬆️ Tahap seterusnya</button>
  <button class="link" id="rep2">📒 Kad Laporan</button><button class="link" id="home2">🏠 Menu</button><button class="link" data-x>🚪 Keluar</button>
</section>

<section id="report" class="screen" style="justify-content:flex-start">
  <h2>📒 Kad Laporan</h2><div id="rname" style="font-weight:700"></div><div id="sum"></div><div id="tbl" style="width:100%;max-width:520px"></div>
  <h2 style="font-size:18px">Sejarah terkini</h2><div id="hist" style="width:100%;max-width:520px;display:flex;flex-direction:column;gap:6px"></div>
  <button class="btn" style="background:var(--b);padding:12px 30px" id="home3">🏠 Menu</button>
  <button class="link" id="clr">🗑️ Padam sejarah</button><button class="link" data-x>🚪 Keluar</button>
</section>

<div id="xm" style="display:none;position:fixed;inset:0;background:#0007;z-index:200;align-items:center;justify-content:center;padding:20px"><div style="background:#fff;border-radius:24px;padding:20px;max-width:340px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px"><h2>🚪 Nak keluar?</h2><div id="xi" class="small" style="margin:0 auto"></div><button class="btn" id="xs" style="background:var(--c)">💾 Simpan &amp; keluar</button><button class="btn" id="xd" style="background:var(--a)">🗑️ Padam &amp; keluar</button><button class="link" id="xc">Batal</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
<script>
"use strict";
const $=id=>document.getElementById(id);
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const R=a=>a[ri(0,a.length-1)];
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
const pick3=(c,pool)=>{const o=shuffle([c,...shuffle([...new Set(pool)].filter(x=>x!==c)).slice(0,2)]);return{opts:o,a:o.indexOf(c)}};
const CH=(big,q,c,pool,lang="ms-MY",say)=>({type:"choice",big,q,say:say||q,lang,...pick3(c,pool)});
const CS=(big,s,lang)=>{const[q,a,...w]=s.split("|");return CH(big,q,a,[a,...w],lang)};
const CSR=(big,arr,lang)=>CS(big,R(arr),lang);
const ORD=(big,q,seq,lang="ms-MY")=>({type:"order",big,q,say:q,lang,seq});
const MAT=(q,pairs,lang="ms-MY")=>({type:"match",big:"",q,say:q,lang,pairs});
const CNT=n=>({type:"count",big:R(["🍎","⭐","🐥","🎈","🍓"]).repeat(n),q:"Berapa banyak? Tunjuk jari!",say:"Berapa banyak? Tunjuk jari!",lang:"ms-MY",a:n});
const NO=(a,big,q,fmt=x=>String(x))=>{const s=new Set([a]);let g=0;while(s.size<5&&g++<60){const d=R([-2,-1,1,2,10,-10]);if(a+d>=0)s.add(a+d)}return CH(big,q,fmt(a),[...s].map(fmt))};
const uniq=(n,lo,hi)=>{const s=new Set();while(s.size<n)s.add(ri(lo,hi));return[...s]};

// ---------- Content by level: 0=Prasekolah, 1-6=Tahun 1-6 (KSPK / KSSR) ----------
const E=["🍎","⭐","🐥","🎈","🍓"];
const MT=[
 ()=>R([()=>CNT(ri(1,5)),()=>{const e=R(E);return MAT("Seret nombor ke kumpulan yang betul",uniq(3,1,5).map(n=>[String(n),e.repeat(n)]))}])(),
 ()=>R([()=>CNT(ri(6,10)),()=>{const a=ri(1,6),b=ri(1,10-a);return NO(a+b,`${a} + ${b}`,"Berapa jumlahnya?")}])(),
 ()=>R([()=>{const a=ri(20,70),b=ri(5,25);return R([()=>NO(a+b,`${a} + ${b}`,"Berapa jumlahnya?"),()=>NO(a-b,`${a} − ${b}`,"Berapa bakinya?")])()},()=>ORD("🔢","Susun dari KECIL ke BESAR",uniq(3,10,99).sort((x,y)=>x-y).map(String))])(),
 ()=>R([()=>{const a=R([2,3,4,5,10]),b=ri(2,9);return NO(a*b,`${a} × ${b}`,"Berapa hasil darab?")},()=>ORD("🔢","Susun dari KECIL ke BESAR",uniq(4,100,999).sort((x,y)=>x-y).map(String))])(),
 ()=>R([()=>{const a=ri(3,12),b=ri(3,12);return NO(a*b,`${a} × ${b}`,"Berapa hasil darab?")},()=>{const a=ri(2,9),b=ri(3,12);return NO(b,`${a*b} ÷ ${a}`,"Berapa hasil bahagi?")},()=>ORD("🔢","Susun dari BESAR ke KECIL",uniq(4,1000,9999).sort((x,y)=>y-x).map(String))])(),
 ()=>R([()=>{const d=R([4,5,8,10]),a=ri(1,d-2),b=ri(1,d-1-a),c=`${a+b}/${d}`;return CH("🍕",`${a}/${d} + ${b}/${d}`,c,[c,`${a+b}/${d*2}`,`${a*b}/${d}`,`${a+b+1}/${d}`],"ms-MY","Berapa jumlahnya?")},()=>{const p=R([10,25,50]),n=R([40,80,200]);return NO(p*n/100,`${p}% daripada ${n}`,"Berapa nilainya?")}])(),
 ()=>R([()=>{const a=ri(11,60),b=ri(11,40);return NO(a+b,`${a/10} + ${b/10}`,"Berapa jumlahnya?",x=>(x/10).toFixed(1))},()=>{const l=ri(6,12),w=ri(3,5);return NO(2*(l+w),`📐 ${l} cm × ${w} cm`,"Berapakah perimeter (cm)?")},()=>ORD("🔢","Susun dari KECIL ke BESAR",uniq(4,11,99).sort((x,y)=>x-y).map(x=>(x/10).toFixed(1)))])()
];
const BMW=[["🍎","Epal"],["🐱","Kucing"],["🐟","Ikan"],["🌙","Bulan"],["🏠","Rumah"],["🚗","Kereta"],["🍌","Pisang"],["🐘","Gajah"],["⭐","Bintang"],["🐔","Ayam"],["🌳","Pokok"],["🥛","Susu"],["🐄","Lembu"],["🪑","Kerusi"]];
const LET=[..."ABCDEFGHIJKLMNOPRSTUY"];
const OPP=[["besar","kecil"],["panas","sejuk"],["tinggi","rendah"],["siang","malam"],["naik","turun"],["panjang","pendek"],["gemuk","kurus"],["atas","bawah"],["laju","perlahan"],["cantik","hodoh"]];
const BM=[
 ()=>R([()=>{const[e,w]=R(BMW);return CH(e,`${w} bermula dengan huruf apa?`,w[0].toUpperCase(),LET)},()=>MAT("Seret gambar ke huruf permulaannya",shuffle(BMW).filter((x,i,a)=>a.findIndex(y=>y[1][0]===x[1][0])===i).slice(0,3).map(([e,w])=>[e,w[0].toUpperCase()]))])(),
 ()=>{const[e,w]=R(BMW),W=w.toUpperCase(),i=ri(0,W.length-1);return CH(e,`${W.slice(0,i)}_${W.slice(i+1)}`,W[i],LET,"ms-MY","Huruf apa yang hilang?")},
 ()=>{const[e,w]=R(BMW.filter(x=>x[1].length<=6));return ORD(e,"Susun huruf untuk eja perkataan",[...w.toUpperCase()])},
 ()=>{const p=R(OPP),s=ri(0,1),w=p[s],o=p[1-s];return CH("↔️",`Apakah lawan kata "${w}"?`,o,OPP.flat())},
 ()=>R([()=>{const N=["Buku","Kucing","Meja","Sekolah","Ibu"],K=["Makan","Lari","Tidur","Menulis","Membaca"],S=["Cantik","Besar","Rajin","Tinggi","Manis"];return MAT("Seret perkataan ke jenis yang betul",[[R(N),"Kata Nama"],[R(K),"Kata Kerja"],[R(S),"Kata Sifat"]])},()=>CSR("📝",["Berat sama dipikul, ___ sama dijinjing.|ringan|berat|kecil","Ada gula ada ___.|semut|kucing|ikan","Bagai aur dengan ___.|tebing|tanah|batu","Malu bertanya ___.|sesat jalan|pandai|kenyang"])])(),
 ()=>CSR("✍️",["ber + jalan =|berjalan|menjalan|jalanan","me + baca =|membaca|bebaca|bacaan","makan + an =|makanan|memakan|bermakan","me + tari =|menari|metari|tarian","ber + main =|bermain|memain|mainan","minum + an =|minuman|meminum|berminum"])
];
const COL=[["🍌","yellow"],["🍎","red"],["🐸","green"],["🌊","blue"],["🍊","orange"],["🍆","purple"]],COLN=COL.map(x=>x[1]);
const ANI=[["🐱","Meow"],["🐶","Woof"],["🐮","Moo"],["🐔","Cluck"],["🐑","Baa"],["🦆","Quack"]];
const VOC=[["🍎","apple"],["🐱","cat"],["🐶","dog"],["🌞","sun"],["📖","book"],["🚌","bus"],["🐟","fish"],["🏠","house"],["🍌","banana"],["🐘","elephant"],["🪑","chair"],["🥛","milk"]];
const OPE=[["big","small"],["hot","cold"],["up","down"],["happy","sad"],["fast","slow"],["day","night"],["open","close"],["old","new"],["full","empty"],["hard","soft"]];
const EN=[
 ()=>R([()=>{const[e,c]=R(COL);return CH(e,"What colour is it?",c,COLN,"en-US")},()=>{const[e,s]=R(ANI);return CH(s+"!","Which animal says this?",e,ANI.map(x=>x[0]),"en-US",`Which animal says ${s}?`)},()=>MAT("Drag each animal to its sound",shuffle(ANI).slice(0,3).map(([e,s])=>[e,s+"!"]),"en-US")])(),
 ()=>{const[e,w]=R(VOC);return CH("🔎",`Which one is "${w}"?`,e,VOC.map(x=>x[0]),"en-US")},
 ()=>{const[e,w]=R(VOC.filter(x=>x[1].length<=6));return ORD(e,"Spell the word",[...w.toUpperCase()],"en-US")},
 ()=>{const p=R(OPE),s=ri(0,1);return CH("↔️",`What is the opposite of "${p[s]}"?`,p[1-s],OPE.flat(),"en-US")},
 ()=>CSR("✏️",["There ___ three cats.|are|is|am","She ___ a red hat.|has|have|are","I ___ a student.|am|is|are","The boys ___ playing.|are|is|am","He ___ two books.|has|have|are"],"en-US"),
 ()=>CSR("⏪",["Yesterday I ___ to school. (go)|went|goed|gone","She ___ a cake. (eat)|ate|eated|eaten","They ___ football. (play)|played|plaied|playing","We ___ a bird. (see)|saw|seed|seen"],"en-US"),
 ()=>CSR("⭐",["tall, taller, ___|tallest|most tall|tallest of","One child, two ___|children|childs|childes","She ___ a book every day. (read)|reads|read|reading","good, better, ___|best|goodest|most good"],"en-US")
];
const SN=[
 ()=>R([()=>CSR("🔍",["Apa yang kita guna untuk melihat?|👁️|👂|👃","Apa yang tumbuh daripada biji benih?|🌱|🪨|🧸","Apa yang memberi cahaya pada siang hari?|☀️|🌙|⭐","Haiwan mana boleh terbang?|🐦|🐘|🐢"]),()=>MAT("Seret haiwan ke tempat tinggalnya",[["🐟","💧 Air"],["🐦","☁️ Langit"],["🐄","🌱 Darat"]])])(),
 ()=>CSR("🧠",["Anggota mana untuk menghidu?|👃 Hidung|👁️ Mata|👂 Telinga","Anggota mana untuk mendengar?|👂 Telinga|👅 Lidah|✋ Tangan","Yang mana benda hidup?|🌱 Pokok|🪨 Batu|🧸 Patung","Anggota mana untuk merasa makanan?|👅 Lidah|👃 Hidung|👁️ Mata"]),
 ()=>R([()=>MAT("Seret haiwan ke makanannya",[["🐄","🌿"],["🐱","🐟"],["🐒","🍌"]]),()=>CS("🌿","Bahagian tumbuhan yang menyerap air?|Akar|Daun|Bunga")])(),
 ()=>CSR("🔬",["Air yang membeku menjadi?|Ais|Wap|Awan","Magnet menarik?|Besi|Kayu|Kertas","Yang mana tenggelam dalam air?|🪨 Batu|🍃 Daun|🪵 Kayu","Air yang dipanaskan menjadi?|Wap|Ais|Batu"]),
 ()=>R([()=>ORD("🪐","Susun planet dari Matahari",["Utarid","Zuhrah","Bumi","Marikh"]),()=>ORD("🦋","Susun kitar hidup rama-rama",["🥚 Telur","🐛 Ulat","🟤 Kepompong","🦋 Rama-rama"])])(),
 ()=>R([()=>ORD("🌧️","Susun kitar air",["☀️ Penyejatan","☁️ Pemeluwapan","🌧️ Hujan"]),()=>CSR("❤️",["Organ yang mengepam darah?|❤️ Jantung|🫁 Paru-paru|🧠 Otak","Makanan mana ada protein?|🥚 Telur|🍬 Gula-gula|🧂 Garam"])])(),
 ()=>CSR("⚡",["Sumber tenaga boleh diperbaharui?|☀️ Suria|⛽ Petrol|🪨 Arang batu","Daya yang menarik objek ke Bumi?|Graviti|Magnet|Geseran","Tumbuhan membuat makanan melalui?|Fotosintesis|Respirasi|Evaporasi"])
];
const GEN={bm:BM,mt:MT,en:EN,sn:SN};
const LVN=["Prasekolah","Tahun 1","Tahun 2","Tahun 3","Tahun 4","Tahun 5","Tahun 6"];
const SUBN={bm:"Bahasa Melayu",mt:"Matematik",en:"English",sn:"Sains"};

// ---------- State & helpers ----------
let sid=0,sub="bm",lv=0,round=0,score=0,cur=null,locked=false,sel=null,okc=0,mist=0,fingers=0,holdStart=0,holdVal=0;
const rounds=()=>5+lv,HOLD_MS=1200;
const show=id=>document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===id));
const isGame=()=>$("game").classList.contains("on");
function speak(t,lang){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=lang;u.rate=.85;u.pitch=1.2;speechSynthesis.speak(u)}catch(e){}}
function beep(ok){try{const c=beep.c||(beep.c=new (window.AudioContext||window.webkitAudioContext)()),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?880:220;g.gain.value=.15;o.start();o.stop(c.currentTime+.3)}catch(e){}}
const HK="jm_hist";
let who="";const key=()=>who.trim().toLowerCase();
const getAll=()=>{try{return JSON.parse(localStorage.getItem(HK))||[]}catch(e){return[]}};
const getH=()=>getAll().filter(x=>(x.p||"")===key());
const setH=h=>{try{localStorage.setItem(HK,JSON.stringify(getAll().filter(x=>(x.p||"")!==key()).concat(h.slice(-100))))}catch(e){}};

// level chips
LVN.forEach((n,i)=>{const b=document.createElement("button");b.className="chip"+(i===0?" on":"");b.textContent=i===0?"Pra":"T"+i;b.title=n;b.onclick=()=>{lv=i;document.querySelectorAll(".chip").forEach((c,j)=>c.classList.toggle("on",j===i))};$("lv").appendChild(b)});
document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{sub=b.dataset.s;start()});
$("back").onclick=$("home2").onclick=$("home3").onclick=()=>{show("home");speechSynthesis.cancel()};
$("again").onclick=()=>start();
$("upg").onclick=()=>{lv=Math.min(6,lv+1);document.querySelectorAll(".chip").forEach((c,j)=>c.classList.toggle("on",j===lv));start()};
$("rep").onclick=$("rep2").onclick=report;
$("clr").onclick=()=>{if(confirm("Padam semua sejarah?")){setH([]);report()}};
$("cambtn").onclick=startCamera;

function start(){sid++;round=0;score=0;show("game");next();if(!camOn)startCamera()}
function next(){
  if(round>=rounds())return finish();
  round++;locked=false;sel=null;okc=0;mist=0;cur=GEN[sub][lv]();
  $("rd").textContent=`${round}/${rounds()} · ${lv?"T"+lv:"Pra"}`;$("sc").textContent=`⭐ ${score}`;
  const big=$("big");big.textContent=cur.big;big.classList.toggle("s",cur.big.length>14||/^[A-Z_]+$/.test(cur.big)&&false);
  $("q").textContent=cur.q;holdVal=0;holdStart=0;$("bar").firstElementChild.style.width="0";
  const o=$("opts");o.innerHTML="";$("dz").style.display="none";$("slots").innerHTML="";$("tray").innerHTML="";
  if(cur.type==="choice"){
    const lg=cur.opts.some(t=>t.length>5);
    cur.opts.forEach((t,i)=>{const d=document.createElement("button");d.className="opt"+(lg?" lg":"");d.innerHTML=`${t}<small>${["☝️","✌️","🤟"][i]}</small>`;d.onclick=()=>answer(i);o.appendChild(d)});
    $("msg").textContent="✋ Tunjuk 1, 2 atau 3 jari — atau sentuh";
  }else if(cur.type==="count"){
    for(let i=1;i<=10;i++){const d=document.createElement("button");d.className="opt n";d.textContent=i;d.onclick=()=>answer(i);o.appendChild(d)}
    $("msg").textContent="✋ Tunjuk jari (1–10, guna dua tangan)";
  }else buildDrag();
  speak(cur.say,cur.lang);
}
function result(ok,extra=""){
  if(locked)return;locked=true;if(ok)score++;beep(ok);$("sc").textContent=`⭐ ${score}`;
  $("msg").textContent=(ok?"🎉 Bagus! Great job!":"😊 Cuba lagi nanti!")+extra;speak(ok?"Bagus!":"Cuba lagi","ms-MY");
  const s=sid;setTimeout(()=>{if(s===sid)next()},ok?1800:2600);
}
function answer(v){
  if(locked)return;const b=[...$("opts").children];
  if(cur.type==="choice"){b[v].classList.add(v===cur.a?"ok":"no");b[cur.a].classList.add("ok")}else b[cur.a-1].classList.add("ok");
  result(v===cur.a)
}

// ---------- Drag & drop (touch + mouse; tap-to-select fallback) ----------
function buildDrag(){
  $("dz").style.display="block";const tray=$("tray"),slots=$("slots");let toks;
  if(cur.type==="match"){
    cur.pairs.forEach(([t,l],i)=>{const s=document.createElement("div");s.className="slot";s.dataset.k=i;s.innerHTML=`<b>${l}</b>`;s.onclick=()=>tapSlot(s);slots.appendChild(s)});
    toks=cur.pairs.map(([t],i)=>[t,i]);$("msg").textContent="👆 Seret ke tempat yang betul (atau sentuh, kemudian sentuh kotak)";
  }else{
    cur.seq.forEach((t,i)=>{const s=document.createElement("div");s.className="slot";s.dataset.i=i;s.textContent=i+1;s.style.opacity=.6;s.onclick=()=>tapSlot(s);slots.appendChild(s)});
    let sh;do sh=shuffle(cur.seq.map(t=>[t]));while(cur.seq.length>1&&sh.map(x=>x[0]).join()===cur.seq.join());
    toks=sh;$("msg").textContent="👆 Seret ikut urutan (sentuh untuk keluarkan semula)";
  }
  toks.forEach(([t,k])=>{const d=document.createElement("div");d.className="tok";d.textContent=t;d.dataset.t=t;if(k!==undefined)d.dataset.k=k;d.onpointerdown=e=>dragStart(e,d);tray.appendChild(d)});
}
function dragStart(e,tok){
  if(locked)return;e.preventDefault();const sx=e.clientX,sy=e.clientY;let moved=false;
  const g=tok.cloneNode(true);g.classList.add("ghost");document.body.appendChild(g);
  const pos=ev=>{g.style.left=ev.clientX-30+"px";g.style.top=ev.clientY-30+"px"};pos(e);tok.classList.add("lift");
  const mv=ev=>{if(Math.hypot(ev.clientX-sx,ev.clientY-sy)>8)moved=true;pos(ev)};
  const up=ev=>{removeEventListener("pointermove",mv);removeEventListener("pointerup",up);removeEventListener("pointercancel",up);g.remove();tok.classList.remove("lift");
    if(moved){const t=document.elementFromPoint(ev.clientX,ev.clientY),s=t&&t.closest(".slot");if(s)drop(tok,s)}
    else if(cur.type==="order"&&tok.parentElement.classList.contains("slot"))$("tray").appendChild(tok);
    else{document.querySelectorAll(".tok").forEach(x=>x.classList.remove("sel"));sel=tok;tok.classList.add("sel")}};
  addEventListener("pointermove",mv);addEventListener("pointerup",up);addEventListener("pointercancel",up);
}
function tapSlot(s){if(sel&&sel.isConnected&&!locked){const t=sel;sel=null;t.classList.remove("sel");drop(t,s)}}
function drop(tok,slot){
  if(locked)return;const ex=slot.querySelector(".tok");
  if(cur.type==="match"){
    if(ex)return;
    if(tok.dataset.k===slot.dataset.k){slot.appendChild(tok);slot.classList.add("ok");tok.onpointerdown=null;tok.style.pointerEvents="none";beep(1);
      if(++okc===cur.pairs.length)result(mist<=1,mist?` (${mist} salah)`:"")}
    else{mist++;beep(0);slot.classList.add("shake");setTimeout(()=>slot.classList.remove("shake"),400);$("msg").textContent="🙂 Cuba lagi!"}
  }else{
    if(ex)$("tray").appendChild(ex);slot.appendChild(tok);slot.style.opacity=1;
    const all=[...$("slots").children].map(s=>s.querySelector(".tok"));
    if(all.every(Boolean)){const got=all.map(t=>t.dataset.t).join("|"),ok=got===cur.seq.join("|");all.forEach((t,i)=>t.parentElement.classList.add(ok?"ok":"shake"));result(ok,ok?"":" Jawapan: "+cur.seq.join(" → "))}
  }
}

// ---------- End, history, report ----------
function finish(){
  const n=rounds(),pct=Math.round(score/n*100);
  const h=getH();h.push({d:Date.now(),l:lv,s:sub,sc:score,n,p:key()});setH(h);
  show("end");$("stars").textContent="⭐".repeat(score)+"☆".repeat(n-score);
  $("endt").textContent=pct>=80?"🏆 Hebat!":pct>=50?"🎉 Pandai!":"💪 Cuba lagi!";
  $("endinfo").textContent=`${LVN[lv]} · ${SUBN[sub]} · ${score}/${n} (${pct}%)`;
  $("upg").style.display=pct>=80&&lv<6?"block":"none";
  speak(pct>=80?"Hebat! Awak pandai!":"Terima kasih sudah bermain!","ms-MY");
}
const grade=p=>p>=80?"A":p>=60?"B":p>=40?"C":"D";
function report(){
  show("report");$("rname").textContent=getName()||"Tetamu";const h=getH(),tot=h.reduce((a,x)=>a+x.sc,0),all=h.reduce((a,x)=>a+x.n,0),pct=all?Math.round(tot/all*100):0;
  $("sum").innerHTML=h.length?`<div style="font-size:42px">${pct>=80?"🥇":pct>=60?"🥈":"🥉"}</div>${h.length} permainan · ⭐ ${tot} bintang · Purata ${pct}% (Gred ${grade(pct)})`:"Belum ada permainan. Jom main dulu! 🎮";
  let t="<table><tr><th>Subjek</th><th>Main</th><th>Purata</th><th>Gred</th><th>Tahap terbaik</th></tr>";
  Object.keys(SUBN).forEach(s=>{const g=h.filter(x=>x.s===s);if(!g.length){t+=`<tr><td>${SUBN[s]}</td><td colspan=4>–</td></tr>`;return}
    const a=Math.round(g.reduce((x,y)=>x+y.sc,0)/g.reduce((x,y)=>x+y.n,0)*100),best=Math.max(...g.filter(x=>x.sc/x.n>=.6).map(x=>x.l),-1);
    t+=`<tr><td>${SUBN[s]}</td><td>${g.length}</td><td>${a}%</td><td><b>${grade(a)}</b></td><td>${best<0?"–":LVN[best]}</td></tr>`});
  $("tbl").innerHTML=t+"</table>";
  $("hist").innerHTML=h.slice(-15).reverse().map(x=>`<div class="row"><span>${new Date(x.d).toLocaleDateString("ms-MY",{day:"2-digit",month:"short"})} · ${LVN[x.l]} · ${SUBN[x.s]}</span><b>${x.sc}/${x.n} ${"⭐".repeat(Math.round(x.sc/x.n*3))}</b></div>`).join("");
}

// ---------- Camera + gestures (MediaPipe Hands, up to 2 hands) ----------
let camOn=false,hands=null,busy=false;
const video=$("v"),cv=$("cv"),ctx=cv.getContext("2d");
async function startCamera(){
  if(camOn)return;
  if(!navigator.mediaDevices||!window.Hands){$("msg").textContent="Kamera tidak tersedia — guna sentuhan ya!";return}
  try{
    video.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:480,height:360},audio:false});
    await video.play();camOn=true;$("cambtn").style.display="none";
    hands=hands||new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}`});
    hands.setOptions({maxNumHands:2,modelComplexity:0,minDetectionConfidence:.6,minTrackingConfidence:.5});
    hands.onResults(onHands);loop();
  }catch(e){$("msg").textContent="Sila benarkan kamera, atau guna sentuhan."}
}
async function loop(){if(!camOn)return;if(!busy&&video.readyState>=2){busy=true;try{await hands.send({image:video})}catch(e){}busy=false}requestAnimationFrame(loop)}
function fingersOf(lm){
  const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),w=lm[0];let n=0;
  [[8,6],[12,10],[16,14],[20,18]].forEach(([t,p])=>{if(d(lm[t],w)>d(lm[p],w)*1.08)n++});
  if(d(lm[4],lm[17])>d(lm[3],lm[17])*1.05&&d(lm[4],lm[9])>d(lm[3],lm[9]))n++;return n;
}
function onHands(r){
  cv.width=video.videoWidth||480;cv.height=video.videoHeight||360;ctx.clearRect(0,0,cv.width,cv.height);
  const H=r.multiHandLandmarks||[];fingers=0;
  ctx.fillStyle="#51cf66";H.forEach(lm=>{fingers+=fingersOf(lm);lm.forEach(p=>{ctx.beginPath();ctx.arc(p.x*cv.width,p.y*cv.height,4,0,7);ctx.fill()})});
  $("fing").textContent=H.length?fingers:"–";
  const bar=$("bar").firstElementChild;
  if(!H.length||locked||!cur||!isGame()||(cur.type!=="choice"&&cur.type!=="count")){holdStart=0;holdVal=0;bar.style.width="0";return}
  const max=cur.type==="count"?10:3;
  if(fingers<1||fingers>max){holdStart=0;holdVal=0;bar.style.width="0";return}
  const now=performance.now();if(fingers!==holdVal){holdVal=fingers;holdStart=now}
  const p=Math.min(1,(now-holdStart)/HOLD_MS);bar.style.width=p*100+"%";
  if(p>=1){const v=fingers;holdVal=0;holdStart=0;answer(cur.type==="choice"?v-1:v)}
}
// ---------- Splash: bouncing name game ----------
const COLS=["#ff6b6b","#4dabf7","#51cf66","#ffa94d","#845ef7","#f783ac","#20c997"];
const getName=()=>who;
function tone(f,d=.2){try{const c=beep.c||(beep.c=new (window.AudioContext||window.webkitAudioContext)()),o=c.createOscillator(),g=c.createGain();o.type="triangle";o.connect(g);g.connect(c.destination);o.frequency.value=f;g.gain.value=.15;o.start();o.stop(c.currentTime+d)}catch(e){}}
function burst(x,y){for(let i=0;i<10;i++){const s=document.createElement("div");s.className="conf";s.textContent=R(["🎉","✨","⭐","💖","🌟"]);s.style.left=x+"px";s.style.top=y+"px";s.style.setProperty("--x",ri(-70,70)+"px");s.style.setProperty("--y",ri(-90,40)+"px");document.body.appendChild(s);setTimeout(()=>s.remove(),900)}}
"JOM MAIN!".split("").forEach((c,i)=>{const s=document.createElement("span");s.textContent=c===" "?"\u00a0":c;s.style.color=COLS[i%7];s.style.animationDelay=i*.1+"s";
  s.onanimationend=ev=>{if(ev.animationName==="pp")s.classList.remove("pop")};
  if(c.trim())s.onclick=e=>{speak(c,"ms-MY");tone(400+i*60);burst(e.clientX,e.clientY);s.classList.add("pop")};$("ttl").appendChild(s)});
let pops=0,tiles=[],looping=false;
setInterval(()=>{if(!$("splash").classList.contains("on"))return;const b=document.createElement("div");b.className="balloon";b.textContent=R(["🎈","🎈","⭐"]);b.style.left=ri(2,86)+"%";b.style.animationDuration=ri(6,10)+"s";
  b.onpointerdown=e=>{b.remove();$("pc").textContent="🎈 "+(++pops);tone(500+ri(0,500),.15);burst(e.clientX,e.clientY)};b.onanimationend=()=>b.remove();document.body.appendChild(b)},2800);
function launch(name){
  const a=$("arena");a.innerHTML="";const W=a.clientWidth||320,H=a.clientHeight||140;
  tiles=[...name.toUpperCase()].filter(c=>c.trim()).slice(0,12).map((c,i)=>{
    const e=document.createElement("div");e.className="bl";e.textContent=c;e.style.background=COLS[i%7];a.appendChild(e);
    const o={e,x:ri(0,W-54),y:ri(0,H-54),vx:(Math.random()<.5?-1:1)*(1.5+Math.random()*2),vy:(Math.random()<.5?-1:1)*(1.5+Math.random()*2)};
    e.onpointerdown=ev=>{speak(c,"ms-MY");tone(450+i*70,.15);burst(ev.clientX,ev.clientY);o.vx*=1.25;o.vy*=1.25;if(Math.abs(o.vx)>9){o.vx/=2;o.vy/=2}};return o});
  if(!looping){looping=true;tick()}
}
function tick(){
  if(!$("splash").classList.contains("on")){looping=false;return}
  const a=$("arena"),W=a.clientWidth,H=a.clientHeight;
  tiles.forEach(o=>{o.x+=o.vx;o.y+=o.vy;if(o.x<0){o.x=0;o.vx=Math.abs(o.vx)}if(o.x>W-54){o.x=W-54;o.vx=-Math.abs(o.vx)}if(o.y<0){o.y=0;o.vy=Math.abs(o.vy)}if(o.y>H-54){o.y=H-54;o.vy=-Math.abs(o.vy)}o.e.style.transform=`translate(${o.x}px,${o.y}px)`});
  requestAnimationFrame(tick)
}
launch("JOMMAIN");
$("go").onclick=()=>launch($("nm").value.trim()||"JOMMAIN");
$("nm").onkeydown=e=>{if(e.key==="Enter")$("go").onclick()};
$("play").onclick=()=>{
  const n=$("nm").value.trim();who=n;
  document.querySelectorAll(".balloon").forEach(x=>x.remove());show("home");
  $("hi").textContent=n?`Hai, ${n}! 👋`:"";speak(n?`Hai ${n}! Jom main!`:"Jom main!","ms-MY");
};
// ---------- Exit: save or clear results, back to landing page ----------
function refreshSplash(){const v=$("nm").value.trim(),n=getAll().filter(x=>(x.p||"")===v.toLowerCase()).length,b=$("seeres");b.style.display=n?"block":"none";b.textContent=`📒 Lihat keputusan ${v||"tetamu"} (${n})`}
function askExit(){const n=getH().length;$("xi").textContent=n?`${n} permainan tersimpan dalam pelayar ini. Simpan untuk dilihat semula nanti, atau padam sekarang.`:"Belum ada keputusan tersimpan.";$("xm").style.display="flex";speechSynthesis.cancel()}
function exitTo(clear){
  if(clear)setH([]);$("xm").style.display="none";sid++;cur=null;locked=true;
  if(camOn){camOn=false;try{video.srcObject.getTracks().forEach(t=>t.stop())}catch(e){}video.srcObject=null;$("cambtn").style.display=""}
  who="";$("nm").value="";$("hi").textContent="";show("splash");launch("JOMMAIN");refreshSplash();
}
document.querySelectorAll("[data-x]").forEach(b=>b.onclick=askExit);
$("xs").onclick=()=>exitTo(false);$("xd").onclick=()=>exitTo(true);$("xc").onclick=()=>$("xm").style.display="none";
$("seeres").onclick=()=>{who=$("nm").value.trim();$("hi").textContent=who?`Hai, ${who}! 👋`:"";report()};$("nm").oninput=refreshSplash;
$("clr").addEventListener("click",()=>setTimeout(refreshSplash,0));
refreshSplash();
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
